name: Version

# Every push to main raises the minor version (0.2.8 -> 0.3.0) in appinfo/info.xml, package.json
# and package-lock.json, commits that to main, tags it (v0.3.0) and runs the release workflow.
#
# The release workflow is called directly: a tag pushed with the default GITHUB_TOKEN does not
# trigger other workflows. Pushes made with GITHUB_TOKEN (the bump commit below) do not trigger
# workflows either, so this does not loop.
on:
  push:
    branches: [main]

permissions:
  contents: write

# Pushes in quick succession are handled one after the other, each on top of the previous bump.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # latest main, not the pushed commit: an earlier run may already have added a bump commit
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump minor version, commit and tag
        id: bump
        run: |
          version=$(node scripts/bump-version.mjs minor)
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appinfo/info.xml package.json package-lock.json
          git commit -m "release $tag [skip ci]"
          git tag "$tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: bump
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
    permissions:
      contents: write
