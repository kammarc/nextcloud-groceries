name: Release

# Builds the app tarball and attaches it to a GitHub release. Runs
# - automatically from the Version workflow after every push to main (it bumps and tags), or
# - when a tag like v0.3.0 (matching <version> in appinfo/info.xml) is pushed by hand.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v0.3.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches app version
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          test "v$version" = "$TAG" || { echo "tag $TAG != info.xml version $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: make appstore
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" build/groceries-*.tar.gz --title "$TAG" --notes "See CHANGELOG.md"
