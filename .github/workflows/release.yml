name: Release

# Push a tag like v0.2.0 (matching <version> in appinfo/info.xml) to build the app tarball and
# attach it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches app version
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' appinfo/info.xml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != info.xml version $version"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: make appstore
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/groceries-*.tar.gz --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
